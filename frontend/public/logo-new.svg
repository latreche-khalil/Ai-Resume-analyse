<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern gradient background circle -->
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="100" cy="100" r="90" fill="url(#mainGradient)" opacity="0.95"/>
  
  <!-- Document icon (stylized resume) -->
  <rect x="60" y="45" width="80" height="100" rx="8" fill="white" opacity="0.95"/>
  
  <!-- Document lines (resume content) -->
  <rect x="72" y="60" width="56" height="4" rx="2" fill="url(#mainGradient)" opacity="0.3"/>
  <rect x="72" y="70" width="46" height="3" rx="1.5" fill="url(#mainGradient)" opacity="0.25"/>
  <rect x="72" y="78" width="52" height="3" rx="1.5" fill="url(#mainGradient)" opacity="0.25"/>
  
  <rect x="72" y="90" width="56" height="4" rx="2" fill="url(#mainGradient)" opacity="0.3"/>
  <rect x="72" y="100" width="42" height="3" rx="1.5" fill="url(#mainGradient)" opacity="0.25"/>
  <rect x="72" y="108" width="48" height="3" rx="1.5" fill="url(#mainGradient)" opacity="0.25"/>
  
  <rect x="72" y="120" width="56" height="4" rx="2" fill="url(#mainGradient)" opacity="0.3"/>
  <rect x="72" y="130" width="38" height="3" rx="1.5" fill="url(#mainGradient)" opacity="0.25"/>
  
  <!-- AI Brain/Sparkle icon overlay -->
  <g filter="url(#glow)">
    <!-- AI Sparkle/Star -->
    <circle cx="125" cy="130" r="18" fill="url(#accentGradient)"/>
    <path d="M125 118 L127 126 L135 128 L127 130 L125 138 L123 130 L115 128 L123 126 Z" 
          fill="white" opacity="0.95"/>
    <!-- Small accent dots -->
    <circle cx="118" cy="122" r="2" fill="white" opacity="0.8"/>
    <circle cx="132" cy="122" r="2" fill="white" opacity="0.8"/>
    <circle cx="132" cy="136" r="2" fill="white" opacity="0.8"/>
  </g>
  
  <!-- Top accent line -->
  <path d="M 50 35 Q 100 25 150 35" stroke="white" stroke-width="3" fill="none" opacity="0.3" stroke-linecap="round"/>
</svg>
